env:
  name: BerkeleyPacman-v0
  level: smallClassic
  
training:
  steps_initial: 500_000
  steps_norm: 500_000
  algorithm: dqn
  ng_margin: 50
  norm_violation_filtering: True
  feature_extractor: complete

rules:
  episodes: 600
  steps: 2500_000
  nr_features: 63
  lime_test_size: 100
  compute_correlation: False
  feature_extractor: extended-8
  model_number: 
  shield_number:
  updates:
    episodes: 500 
    data_collection_episodes: 100
    prune_interval: 75

asp:
  horizon: 3
  radius: 5

eval:
  nr_episodes: 250

defaults:
  - norm: vegetarian
